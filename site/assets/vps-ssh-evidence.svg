<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">接続確認の根拠を分ける</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">対象と設定</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">接続先・ユーザー・鍵の指定</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">設定と適用は別</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">選んだサーバーへの適用を確認</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">観測した結果を記録</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">空欄は未確認、成功扱いにしない</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">編集上の記録方法｜公式条件確認日 2026-10-14</text></svg>