<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">タイトルだけで原因を決めない</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">公式通知</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">対象・時間・影響・更新内容</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">本人の現象</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">対象・経路・時点を記録</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">照合の結果</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">一致・不一致・未確認＋理由</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">編集上の照合方法｜サーバー操作なし</text></svg>