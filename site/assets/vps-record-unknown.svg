<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t"><title id="t">未確認条件を保留する</title><rect width="640" height="420" rx="24" fill="#f6f0e6"/><g font-family="sans-serif" fill="#493c25"><text x="40" y="64" font-size="28" font-weight="bold">未確認を、結論に変えない</text><rect x="32" y="105" width="576" height="84" rx="16" fill="white"/><text x="56" y="156" font-size="28">停止中の課金：未確認</text><text x="310" y="232" font-size="32">↓</text><rect x="32" y="253" width="576" height="84" rx="16" fill="white"/><text x="56" y="304" font-size="28">公式条件を照合・確認元を記録</text><text x="40" y="382" font-size="24">確認できない条件は、未確認のまま残す</text></g></svg>
