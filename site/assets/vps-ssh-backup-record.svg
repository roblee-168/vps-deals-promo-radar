<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">保存の表示だけで決めない</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">保存した対象を確認</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">ブートと追加ディスクを分ける</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">復元先を確認</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">取得元だけか、新規先で使えるか</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">結果を記録</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">未確認のまま成功にしない</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">元記事の編集上の手順｜確認日 2026-10-14</text></svg>