<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">転送と速度を分ける</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">転送量の料金</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">無料の表示を単独で読む</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">回線の条件</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">共有・制限の原文も残す</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">本人の観測</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">料金表から結果を推定しない</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">公式料金表の読み方｜確認 2026-10-15</text></svg>