<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840"><rect width="1280" height="840" fill="#edf4ee"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#173f37"><text x="72" y="94" font-size="22" letter-spacing="4">PERKMINGLE / VPS</text><text x="72" y="176" font-size="43" font-weight="700">単価の換算 ≠ 終了日の確認</text><text x="72" y="232" font-size="27">比較値と契約条件を混同しない</text><rect x="72" y="300" width="1136" height="100" rx="18" fill="#fff"/><text x="104" y="340" font-size="25" font-weight="700">時間単価</text><text x="400" y="359" font-size="28">公式料金表の単位を確認</text><rect x="72" y="425" width="1136" height="100" rx="18" fill="#fff"/><text x="104" y="465" font-size="25" font-weight="700">換算</text><text x="400" y="484" font-size="28">比較用の期間を決めて計算</text><rect x="72" y="550" width="1136" height="100" rx="18" fill="#fff"/><text x="104" y="590" font-size="25" font-weight="700">終了条件</text><text x="400" y="609" font-size="28">削除・満了・解約条件を別に確認</text><text x="72" y="746" font-size="27">単価だけで、課金が終わったとは判断しない</text><text x="72" y="797" font-size="20">記事の公式条件・確認日：2026-10-13</text></g></svg>