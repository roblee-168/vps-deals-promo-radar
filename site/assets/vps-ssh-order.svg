<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">一度に変えない確認順序</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">接続先を照合</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">有効なクライアント設定を見る</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">許可と認証を分ける</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">サーバー内の設定も別欄へ</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">差分と結果を残す</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">複数の変更から原因を決めない</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">公式手順の照合図｜確認日 2026-10-14</text></svg>