<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">似た画面だけでは進めない</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">対象一致</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">該当機能の残る条件を確認</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">対象外</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">使わない理由と出典を残す</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">未確認</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">足りない根拠を明示して保留</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">編集上の判断方法｜契約画面の操作なし</text></svg>