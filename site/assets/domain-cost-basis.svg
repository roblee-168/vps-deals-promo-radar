<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="t"><title id="t">ドメインの取得と更新を別欄に記録する</title><rect width="640" height="390" rx="24" fill="#edf4f0"/><g font-family="sans-serif" fill="#16382c"><text x="40" y="62" font-size="28" font-weight="bold">ドメイン料金の読み方</text><rect x="32" y="100" width="576" height="90" rx="16" fill="white"/><text x="56" y="155" font-size="28">取得価格：最初の登録の基礎料金</text><rect x="32" y="210" width="576" height="90" rx="16" fill="white"/><text x="56" y="265" font-size="28">更新価格：継続利用の基礎料金</text><text x="40" y="352" font-size="24">公式表示と確認日を、それぞれの欄に残す</text></g></svg>
