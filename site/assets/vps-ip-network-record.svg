<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">観測条件をそろえて残す</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">通信するIP</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">設定した対象と同じか</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">方向と相手</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">違う条件は別の記録へ</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">表示と観測</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">設定完了だけで結果を決めない</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">帯域記事にある照合方法｜2026-10-15</text></svg>