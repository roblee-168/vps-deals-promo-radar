<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840"><rect width="1280" height="840" fill="#edf4ee"/><g font-family="Yu Gothic,Meiryo,sans-serif" fill="#173f37"><text x="72" y="94" font-size="22" letter-spacing="4">PERKMINGLE / VPS</text><text x="72" y="176" font-size="43" font-weight="700">先に、契約方式を確かめる</text><text x="72" y="232" font-size="27">停止・削除・更新停止は別の操作</text><rect x="72" y="300" width="1136" height="100" rx="18" fill="#fff"/><text x="104" y="340" font-size="25" font-weight="700">時間課金</text><text x="400" y="359" font-size="28">削除までの利用時間を確認</text><rect x="72" y="425" width="1136" height="100" rx="18" fill="#fff"/><text x="104" y="465" font-size="25" font-weight="700">前払い</text><text x="400" y="484" font-size="28">自動更新と満了条件を確認</text><rect x="72" y="550" width="1136" height="100" rx="18" fill="#fff"/><text x="104" y="590" font-size="25" font-weight="700">解約申請</text><text x="400" y="609" font-size="28">利用期限・支払状況を確認</text><text x="72" y="746" font-size="27">公式条件を、自分の契約表示と照合する</text><text x="72" y="797" font-size="20">記事の公式条件・確認日：2026-10-13</text></g></svg>