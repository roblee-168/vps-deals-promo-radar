<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">古い設定例を流用しない</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">本人のOSと版</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">現在の環境を先に記録</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">公式例の対象</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">同じ設定方式かを照合</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">合わないとき</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">適用せず未確認として引き継ぐ</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">公式のOS依存説明＋編集上の判断｜2026-10-15</text></svg>