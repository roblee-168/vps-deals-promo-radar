<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">観測の空白を埋めない</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">観測する前</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">対象・経路・期待を固定</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">観測した時点</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">表示と機能応答を別欄へ</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">未実施なら未確認</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">成功率や稼働率に変えない</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">編集上の記録方法｜サーバー操作なし</text></svg>