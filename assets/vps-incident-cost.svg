<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">年額と月額換算を区別</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">石狩・メモリ1GB</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">年額9,680円（税込）</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">年額を12ヶ月で割る</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">9,680 ÷ 12 ≈ 806.67円</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">公式表示は807円／月</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">月額払い・補償額とは別</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">vps.sakura.ad.jp/｜確認 2026-10-16</text></svg>