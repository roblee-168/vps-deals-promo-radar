<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">公開検索と個別相談を分ける</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">公開検索に個人情報を入れない</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">氏名・連絡先・会員IDは入力しない</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">事実と未確認を分ける</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">対象・時点・質問を手元で整理</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">フォームは添付非対応</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">添付が必要なら公式メール案内へ</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">公式条件＋編集整理｜確認日 2026-10-17</text></svg>