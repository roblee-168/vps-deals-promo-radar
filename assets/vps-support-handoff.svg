<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">引き継ぐ前に範囲を照合</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">公式の対象・対象外</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">該当する説明と確認日を残す</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">作業を引き受ける担当</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">本人・社内・委託先で確認</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">未確定の欄</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">担当も費用も未確認のまま残す</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">編集上の確認手順｜代行・復旧の保証ではありません</text></svg>