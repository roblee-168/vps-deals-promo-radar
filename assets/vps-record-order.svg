<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t"><title id="t">条件が食い違ったときの確認順序</title><rect width="640" height="500" rx="24" fill="#edf1f7"/><g font-family="sans-serif" fill="#263e5a"><text x="40" y="60" font-size="28" font-weight="bold">条件が食い違ったら</text><g fill="white"><rect x="32" y="90" width="576" height="74" rx="14"/><rect x="32" y="185" width="576" height="74" rx="14"/><rect x="32" y="280" width="576" height="74" rx="14"/><rect x="32" y="375" width="576" height="74" rx="14"/></g><g font-size="26"><text x="52" y="137">確認対象の資源をそろえる</text><text x="52" y="232">状態と契約の確認日を分ける</text><text x="52" y="327">不明な終了条件を一つずつ残す</text><text x="52" y="422">問い合わせたい点を文章にする</text></g></g></svg>
