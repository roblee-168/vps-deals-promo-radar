<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">削除前の保存確認</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">停止と削除を分ける</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">停止だけでは料金終了にならない</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">必要なデータを保存</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">削除したサーバーは復旧できない</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">対象契約を照合</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">料金終了の条件は別に確認</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">support.conoha.jp/v/deletevps/｜元記事確認日 2026-10-13</text></svg>