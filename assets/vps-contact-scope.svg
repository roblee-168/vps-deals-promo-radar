<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><rect width="600" height="600" rx="28" fill="#edf2e9"/><text x="38" y="65" font-family="sans-serif" font-size="28" fill="#17483d">窓口を選んだ後の確認</text><rect x="32" y="105" width="536" height="99" rx="14" fill="white"/><text x="52" y="143" font-family="sans-serif" font-size="24" fill="#17483d">入口の案内</text><text x="52" y="180" font-family="sans-serif" font-size="21" fill="#46594e">どこへ質問するか</text><rect x="32" y="220" width="536" height="99" rx="14" fill="white"/><text x="52" y="258" font-family="sans-serif" font-size="24" fill="#17483d">サポート範囲の案内</text><text x="52" y="295" font-family="sans-serif" font-size="21" fill="#46594e">何を依頼できるか</text><rect x="32" y="335" width="536" height="99" rx="14" fill="white"/><text x="52" y="373" font-family="sans-serif" font-size="24" fill="#17483d">別々に確認</text><text x="52" y="410" font-family="sans-serif" font-size="21" fill="#46594e">連絡先だけで作業範囲を決めない</text><text x="36" y="560" font-family="sans-serif" font-size="16" fill="#46594e">問い合わせ準備の補助図｜編集上の整理</text></svg>